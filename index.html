<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スペースギャラクシーゲーム - PLANET OF THE APES</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030712;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: radial-gradient(circle at center, #0B0F19 0%, #020617 100%);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
            touch-action: none; /* Prevents scrolling on touch screens */
        }

        .hud-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }

        .glow-button {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease-in-out;
        }

        .glow-button:hover {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.8);
            transform: translateY(-2px);
        }

        .glow-button:active {
            transform: translateY(1px);
        }

        /* Touch Controls for Mobile */
        .touch-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="game-container">
        <!-- Main Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD (Heads Up Display) Overlay -->
        <div id="hud" class="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col justify-between p-4 sm:p-6 hidden">
            <!-- Top HUD Bar -->
            <div class="flex justify-between items-start w-full">
                <!-- HP & Shield -->
                <div class="hud-panel p-3 rounded-xl flex flex-col gap-2 min-w-[160px] sm:min-w-[220px]">
                    <div class="flex items-center justify-between text-xs sm:text-sm font-bold text-cyan-400">
                        <span><i class="fa-solid fa-shield-halved mr-1"></i> シールド</span>
                        <span id="hp-text">100 / 100</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-2.5 overflow-hidden border border-cyan-500/30">
                        <div id="hp-bar" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-2.5 rounded-full transition-all duration-200" style="width: 100%"></div>
                    </div>

                    <!-- Special Skill Gauge -->
                    <div class="flex items-center justify-between text-xs sm:text-sm font-bold text-amber-400 mt-1">
                        <span><i class="fa-solid fa-bolt mr-1"></i> ハイパーボム</span>
                        <span id="bomb-text">READY</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden border border-amber-500/30">
                        <div id="bomb-bar" class="bg-gradient-to-r from-amber-500 to-yellow-300 h-2 rounded-full transition-all duration-200" style="width: 100%"></div>
                    </div>
                </div>

                <!-- Score & Wave -->
                <div class="hud-panel p-3 rounded-xl text-right">
                    <div class="text-xs text-gray-400 font-semibold tracking-wider">SCORE</div>
                    <div id="score-display" class="text-xl sm:text-3xl font-black text-white glow-text tracking-wider">0</div>
                    <div class="text-xs text-indigo-400 mt-1 font-bold" id="wave-display">WAVE 1</div>
                </div>
            </div>

            <!-- Boss Health Bar (Hidden by default) -->
            <div id="boss-hud" class="self-center w-full max-w-lg hud-panel p-3 rounded-xl hidden transition-all">
                <div class="flex justify-between items-center text-xs sm:text-sm font-bold text-red-400 mb-1">
                    <span class="tracking-widest"><i class="fa-solid fa-skull mr-2"></i>BOSS</span>
                    <span id="boss-hp-text">100%</span>
                </div>
                <div class="w-full bg-gray-900 rounded-full h-3.5 overflow-hidden border border-red-500/50 p-0.5">
                    <div id="boss-hp-bar" class="bg-gradient-to-r from-red-600 via-orange-500 to-yellow-400 h-full rounded-full transition-all duration-150" style="width: 100%"></div>
                </div>
            </div>

            <!-- Mobile Controls (Visible on touch devices via JS detection) -->
            <div id="touch-controls" class="pointer-events-auto flex justify-between items-end w-full pb-2 px-2 hidden">
                <div class="text-gray-400 text-xs bg-black/40 px-3 py-1 rounded-full backdrop-blur-sm">
                    画面ドラッグで移動
                </div>
                <button id="btn-bomb" class="touch-btn w-16 h-16 bg-amber-500/30 border-amber-400 text-amber-300 text-xl font-bold active:scale-95 transition-transform shadow-lg">
                    <i class="fa-solid fa-burst"></i>
                </button>
            </div>
        </div>

        <!-- Start / Game Over Screen -->
        <div id="overlay-screen" class="absolute inset-0 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md z-10 overflow-y-auto">
            <div class="hud-panel max-w-md w-full p-5 sm:p-8 rounded-2xl text-center border-cyan-500/40 relative overflow-hidden my-auto">
                <!-- Background decorative glow -->
                <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl"></div>
                <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl"></div>

                <!-- Title Header -->
                <div id="menu-header">
                    <div class="inline-block p-3 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 mb-2 sm:mb-3">
                        <i class="fa-solid fa-shuttle-space text-3xl sm:text-4xl"></i>
                    </div>
                    <h1 class="text-2xl sm:text-4xl font-extrabold tracking-wider text-white glow-text mb-1 sm:mb-2">PLANET OF THE APES</h1>
                    <p class="text-xs sm:text-sm text-gray-400 mb-4 sm:mb-6">猿の惑星の軍勢と巨大な大猿ボスを撃破せよ！</p>
                </div>

                <!-- Game Over Details (Hidden initially) -->
                <div id="game-over-details" class="hidden mb-4 sm:mb-6">
                    <div class="text-red-400 text-xl sm:text-2xl font-black mb-2 tracking-widest">GAME OVER</div>
                    <div class="bg-slate-900/80 rounded-xl p-3 sm:p-4 border border-slate-800 text-left space-y-1 sm:space-y-2">
                        <div class="flex justify-between text-xs sm:text-sm">
                            <span class="text-gray-400">最終スコア:</span>
                            <span id="final-score" class="font-bold text-white text-base sm:text-lg">0</span>
                        </div>
                        <div class="flex justify-between text-xs sm:text-sm">
                            <span class="text-gray-400">到達ウェーブ:</span>
                            <span id="final-wave" class="font-bold text-cyan-400">WAVE 1</span>
                        </div>
                        <div class="flex justify-between text-xs sm:text-sm">
                            <span class="text-gray-400">撃破数:</span>
                            <span id="final-kills" class="font-bold text-emerald-400">0</span>
                        </div>
                    </div>
                </div>

                <!-- Controls Guide -->
                <div class="text-xs text-gray-400 bg-slate-900/60 p-2.5 sm:p-3 rounded-xl border border-slate-800/80 mb-4 sm:mb-6 text-left space-y-1">
                    <div class="font-semibold text-gray-300 mb-1"><i class="fa-solid fa-gamepad mr-1"></i> 操作方法:</div>
                    <div>• <b>移動:</b> 画面スワイプ / マウス移動 / WASD</div>
                    <div>• <b>通常攻撃:</b> 自動連射</div>
                    <div>• <b>超連打ショット:</b> [Space] キー（PC）</div>
                    <div>• <b>ボム (全画面攻撃):</b> 右下ボムボタン または [B]</div>
                </div>

                <!-- Action Button -->
                <button id="start-btn" class="w-full py-3 sm:py-3.5 px-6 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold text-base sm:text-lg tracking-wider glow-button">
                    ミッション開始
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- GAME ENGINE & LOGIC ---
        window.onload = function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // UI Elements
            const overlayScreen = document.getElementById('overlay-screen');
            const menuHeader = document.getElementById('menu-header');
            const gameOverDetails = document.getElementById('game-over-details');
            const startBtn = document.getElementById('start-btn');
            const hud = document.getElementById('hud');
            const hpBar = document.getElementById('hp-bar');
            const hpText = document.getElementById('hp-text');
            const bombBar = document.getElementById('bomb-bar');
            const bombText = document.getElementById('bomb-text');
            const scoreDisplay = document.getElementById('score-display');
            const waveDisplay = document.getElementById('wave-display');
            const bossHud = document.getElementById('boss-hud');
            const bossHpBar = document.getElementById('boss-hp-bar');
            const bossHpText = document.getElementById('boss-hp-text');
            const touchControls = document.getElementById('touch-controls');
            const btnBomb = document.getElementById('btn-bomb');

            // Mobile / Touch detection & UI display
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            if (isTouchDevice) {
                touchControls.classList.remove('hidden');
            }

            // Canvas Sizing
            function resizeCanvas() {
                canvas.width = window.innerWidth <= 640 ? window.innerWidth : Math.min(window.innerWidth, 800);
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Audio Context (Synthesized SFX using Web Audio API)
            class SoundSystem {
                constructor() {
                    this.ctx = null;
                }

                init() {
                    if (!this.ctx) {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                }

                playShoot() {
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                }

                playExplosion(isBig = false) {
                    if (!this.ctx) return;
                    const dur = isBig ? 0.6 : 0.3;
                    const bufferSize = this.ctx.sampleRate * dur;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(isBig ? 400 : 800, this.ctx.currentTime);
                    filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + dur);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(isBig ? 0.3 : 0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + dur);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start();
                }

                playPowerup() {
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                }

                playBomb() {
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.8);
                    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.8);
                }
            }

            const sounds = new SoundSystem();

            // Game State
            let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
            let score = 0;
            let wave = 1;
            let kills = 0;
            let keys = {};
            let touchX = null;
            let touchY = null;
            let waveEnemiesSpawned = 0;
            let waveTotalEnemies = 15;

            // Collections
            const bullets = [];
            const enemyBullets = [];
            const enemies = [];
            const powerups = [];
            const particles = [];
            const shockwaves = [];
            let boss = null;

            // Background Starfield
            const stars = [];
            for (let i = 0; i < 120; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 2 + 0.5,
                    alpha: Math.random() * 0.8 + 0.2
                });
            }

            // Player Object
            const player = {
                x: canvas.width / 2,
                y: canvas.height - 100,
                width: 44,
                height: 48,
                speed: 6,
                maxHp: 100,
                hp: 100,
                weaponLevel: 1, // 1: single/triple, 2: quad, 3: spread penta
                shootTimer: 0,
                shootInterval: 10,
                bombEnergy: 100,
                maxBombEnergy: 100,
                isInvincible: false,
                invincibleTimer: 0,

                reset() {
                    this.x = canvas.width / 2;
                    this.y = canvas.height - 100;
                    this.hp = this.maxHp;
                    this.weaponLevel = 1;
                    this.bombEnergy = 100;
                    this.isInvincible = false;
                },

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    if (this.isInvincible && Math.floor(Date.now() / 100) % 2 === 0) {
                        ctx.globalAlpha = 0.5;
                    }

                    // Engine Flame Effect
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.moveTo(-8, this.height / 2);
                    ctx.lineTo(8, this.height / 2);
                    ctx.lineTo(0, this.height / 2 + 15 + Math.random() * 8);
                    ctx.closePath();
                    ctx.fill();

                    // Main Ship Body
                    ctx.fillStyle = '#0284c7';
                    ctx.beginPath();
                    ctx.moveTo(0, -this.height / 2);
                    ctx.lineTo(this.width / 2, this.height / 2);
                    ctx.lineTo(0, this.height / 3);
                    ctx.lineTo(-this.width / 2, this.height / 2);
                    ctx.closePath();
                    ctx.fill();

                    // Wings & Accents
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.moveTo(0, -this.height / 4);
                    ctx.lineTo(this.width / 2 + 6, this.height / 3);
                    ctx.lineTo(this.width / 2, this.height / 2);
                    ctx.lineTo(0, this.height / 6);
                    ctx.lineTo(-this.width / 2, this.height / 2);
                    ctx.lineTo(-this.width / 2 - 6, this.height / 3);
                    ctx.closePath();
                    ctx.fill();

                    // Cockpit Glass
                    ctx.fillStyle = '#e0f2fe';
                    ctx.beginPath();
                    ctx.ellipse(0, -this.height / 6, 6, 12, 0, 0, Math.PI * 2);
                    ctx.fill();

                    if (this.weaponLevel >= 3) {
                        ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 0, this.width, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    ctx.restore();
                },

                update() {
                    // Keyboard Movement
                    if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
                    if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
                    if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
                    if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;

                    // Touch / Mouse Follow
                    if (touchX !== null && touchY !== null) {
                        // スマホの指（タッチ）位置より自機を上に配置するためのY軸オフセット
                        const touchOffsetY = isTouchDevice ? 70 : 0;
                        const targetY = touchY - touchOffsetY;
                        const dx = touchX - this.x;
                        const dy = targetY - this.y;
                        this.x += dx * 0.2;
                        this.y += dy * 0.2;
                    }

                    // Bounds
                    this.x = Math.max(this.width / 2, Math.min(canvas.width - this.width / 2, this.x));
                    this.y = Math.max(this.height / 2, Math.min(canvas.height - this.height / 2, this.y));

                    // Shooting
                    const currentInterval = keys['Space'] ? 2 : this.shootInterval;
                    this.shootTimer++;
                    if (this.shootTimer >= currentInterval) {
                        this.shoot();
                        this.shootTimer = 0;
                    }

                    // Recharge Bomb Energy
                    if (this.bombEnergy < this.maxBombEnergy) {
                        this.bombEnergy += 0.08;
                    }

                    // Invincibility Timer
                    if (this.isInvincible) {
                        this.invincibleTimer--;
                        if (this.invincibleTimer <= 0) {
                            this.isInvincible = false;
                        }
                    }
                },

                shoot() {
                    sounds.playShoot();
                    if (this.weaponLevel === 1) {
                        bullets.push(new Bullet(this.x, this.y - 20, 0, -12, '#38bdf8'));
                        bullets.push(new Bullet(this.x - 20, this.y, -1, -10, '#06b6d4', 5));
                        bullets.push(new Bullet(this.x + 20, this.y, 1, -10, '#06b6d4', 5));
                    } else if (this.weaponLevel === 2) {
                        bullets.push(new Bullet(this.x - 12, this.y - 10, 0, -12, '#38bdf8'));
                        bullets.push(new Bullet(this.x + 12, this.y - 10, 0, -12, '#38bdf8'));
                        bullets.push(new Bullet(this.x - 24, this.y, -3, -10, '#38bdf8', 6));
                        bullets.push(new Bullet(this.x + 24, this.y, 3, -10, '#38bdf8', 6));
                    } else {
                        bullets.push(new Bullet(this.x, this.y - 20, 0, -13, '#a855f7'));
                        bullets.push(new Bullet(this.x - 10, this.y - 10, -2, -12, '#a855f7'));
                        bullets.push(new Bullet(this.x + 10, this.y - 10, 2, -12, '#a855f7'));
                        bullets.push(new Bullet(this.x - 24, this.y, -4.5, -9, '#ec4899', 7));
                        bullets.push(new Bullet(this.x + 24, this.y, 4.5, -9, '#ec4899', 7));
                    }
                },

                triggerBomb() {
                    if (this.bombEnergy >= this.maxBombEnergy) {
                        this.bombEnergy = 0;
                        sounds.playBomb();

                        shockwaves.push(new Shockwave(canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height)));
                        enemyBullets.length = 0;

                        enemies.forEach(enemy => {
                            enemy.takeDamage(150);
                        });

                        if (boss) {
                            boss.takeDamage(200);
                        }
                    }
                }
            };

            // Player Bullet Class
            class Bullet {
                constructor(x, y, vx, vy, color, radius = 4) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.radius = radius;
                    this.color = color;
                    this.markedForDeletion = false;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
                        this.markedForDeletion = true;
                    }
                }

                draw() {
                    ctx.save();
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Enemy Bullet Class
            class EnemyBullet {
                constructor(x, y, vx, vy) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.radius = 4;
                    this.markedForDeletion = false;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.y > canvas.height + 10 || this.x < -10 || this.x > canvas.width + 10) {
                        this.markedForDeletion = true;
                    }
                }

                draw() {
                    ctx.save();
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Enemy Class
            class Enemy {
                constructor(type) {
                    this.type = type;
                    this.x = Math.random() * (canvas.width - 60) + 30;
                    this.y = -40;
                    this.markedForDeletion = false;

                    if (type === 'asteroid') {
                        this.radius = Math.random() * 15 + 15;
                        this.speedY = Math.random() * 2 + 1.5;
                        this.speedX = (Math.random() - 0.5) * 1;
                        this.hp = Math.floor(this.radius);
                        this.points = 100;
                        this.color = '#94a3b8';
                        this.rotation = 0;
                        this.rotSpeed = (Math.random() - 0.5) * 0.05;
                    } else if (type === 'ape_warrior') {
                        this.radius = 18;
                        this.speedY = 1.6;
                        this.speedX = (Math.random() < 0.5 ? 1 : -1) * 2;
                        this.hp = 35;
                        this.points = 300;
                        this.color = '#78350f';
                        this.shootTimer = 0;
                        this.animTimer = Math.random() * 10;
                    } else if (type === 'ape_giant') {
                        this.radius = 32;
                        this.speedY = 1.0;
                        this.speedX = (Math.random() < 0.5 ? 1.2 : -1.2);
                        this.hp = 180 + wave * 40;
                        this.points = 1200;
                        this.color = '#451a03';
                        this.shootTimer = 0;
                        this.animTimer = 0;
                    } else if (type === 'scout') {
                        this.radius = 16;
                        this.speedY = Math.random() * 1.5 + 2;
                        this.speedX = Math.sin(this.y * 0.05) * 2;
                        this.hp = 20;
                        this.points = 250;
                        this.color = '#f59e0b';
                        this.shootTimer = 0;
                    }
                }

                update() {
                    if (this.type === 'asteroid') {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        this.rotation += this.rotSpeed;
                    } else if (this.type === 'ape_warrior') {
                        this.y += this.speedY;
                        this.animTimer += 0.15;
                        this.x += Math.sin(this.animTimer) * 3;

                        if (this.x < 30 || this.x > canvas.width - 30) {
                            this.speedX *= -1;
                        }

                        this.shootTimer++;
                        if (this.shootTimer % 50 === 0) {
                            enemyBullets.push(new EnemyBullet(this.x, this.y + 15, 0, 5.5));
                        }
                    } else if (this.type === 'ape_giant') {
                        this.y += this.speedY;
                        this.animTimer += 0.1;
                        this.x += this.speedX;

                        if (this.x < 50 || this.x > canvas.width - 50) {
                            this.speedX *= -1;
                        }

                        this.shootTimer++;
                        if (this.shootTimer % 45 === 0) {
                            enemyBullets.push(new EnemyBullet(this.x, this.y + 20, -2, 5));
                            enemyBullets.push(new EnemyBullet(this.x, this.y + 20, 0, 5.5));
                            enemyBullets.push(new EnemyBullet(this.x, this.y + 20, 2, 5));
                        }
                    } else if (this.type === 'scout') {
                        this.y += this.speedY;
                        this.x += Math.sin(this.y * 0.03) * 2;

                        this.shootTimer++;
                        if (this.shootTimer % 80 === 0) {
                            enemyBullets.push(new EnemyBullet(this.x, this.y + 15, 0, 5));
                        }
                    }

                    if (this.y > canvas.height + 50) {
                        this.markedForDeletion = true;
                    }
                }

                takeDamage(amount) {
                    this.hp -= amount;
                    if (this.hp <= 0) {
                        this.markedForDeletion = true;
                        score += this.points;
                        kills++;
                        sounds.playExplosion(this.type === 'ape_giant');
                        createExplosionParticles(this.x, this.y, this.radius, this.color);

                        // Drop powerup chance
                        if (Math.random() < 0.25) {
                            const pType = Math.random() < 0.5 ? 'weapon' : 'heal';
                            powerups.push(new PowerUp(this.x, this.y, pType));
                        }
                    }
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    if (this.type === 'asteroid') {
                        ctx.rotate(this.rotation);
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#64748b';
                        ctx.stroke();
                    } else if (this.type === 'ape_warrior' || this.type === 'ape_giant') {
                        // Draw Ape-like Silhouette Space Ship
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(0, -5, this.radius * 0.7, 0, Math.PI * 2); // Head
                        ctx.fill();

                        // Shoulders/Body
                        ctx.fillStyle = '#1e293b';
                        ctx.beginPath();
                        ctx.ellipse(0, 10, this.radius, this.radius * 0.6, 0, 0, Math.PI * 2);
                        ctx.fill();

                        // Glowing Red Ape Eyes
                        ctx.fillStyle = '#ef4444';
                        ctx.shadowColor = '#ef4444';
                        ctx.shadowBlur = 8;
                        ctx.beginPath();
                        ctx.arc(-this.radius * 0.25, -6, 3, 0, Math.PI * 2);
                        ctx.arc(this.radius * 0.25, -6, 3, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // Scout
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.moveTo(0, this.radius);
                        ctx.lineTo(this.radius, -this.radius);
                        ctx.lineTo(-this.radius, -this.radius);
                        ctx.closePath();
                        ctx.fill();
                    }

                    ctx.restore();
                }
            }

            // Giant Ape Boss Class
            class Boss {
                constructor() {
                    this.x = canvas.width / 2;
                    this.y = -100;
                    this.targetY = 120;
                    this.radius = 65;
                    this.maxHp = 1000 + wave * 500;
                    this.hp = this.maxHp;
                    this.speedX = 2.5;
                    this.shootTimer = 0;
                    this.phase = 1;
                    this.color = '#b91c1c';
                }

                update() {
                    if (this.y < this.targetY) {
                        this.y += 1.5;
                    } else {
                        this.x += this.speedX;
                        if (this.x < 80 || this.x > canvas.width - 80) {
                            this.speedX *= -1;
                        }
                    }

                    this.shootTimer++;
                    if (this.shootTimer % 35 === 0) {
                        // Bullet barrage pattern
                        const angles = [-0.4, -0.2, 0, 0.2, 0.4];
                        angles.forEach(ang => {
                            enemyBullets.push(new EnemyBullet(this.x, this.y + 40, Math.sin(ang) * 6, Math.cos(ang) * 6));
                        });
                    }
                }

                takeDamage(amount) {
                    this.hp -= amount;
                    if (this.hp <= 0) {
                        this.hp = 0;
                        score += 10000;
                        kills++;
                        sounds.playExplosion(true);
                        createExplosionParticles(this.x, this.y, 80, '#f97316');
                        boss = null;
                        bossHud.classList.add('hidden');

                        // Wave Complete -> Next Wave
                        wave++;
                        startNextWave();
                    }
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    // Boss Aura
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 15, 0, Math.PI * 2);
                    ctx.fill();

                    // Main Ape Skull Ship
                    ctx.fillStyle = '#27272a';
                    ctx.beginPath();
                    ctx.arc(0, -10, this.radius, 0, Math.PI * 2);
                    ctx.fill();

                    // Jaw/Armor
                    ctx.fillStyle = '#7f1d1d';
                    ctx.fillRect(-this.radius * 0.7, 10, this.radius * 1.4, this.radius * 0.6);

                    // Glowing Red Eyes
                    ctx.fillStyle = '#ff0000';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(-22, -15, 9, 0, Math.PI * 2);
                    ctx.arc(22, -15, 9, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            }

            // PowerUp Item
            class PowerUp {
                constructor(x, y, type) {
                    this.x = x;
                    this.y = y;
                    this.type = type; // 'weapon' or 'heal'
                    this.radius = 12;
                    this.speedY = 1.8;
                    this.markedForDeletion = false;
                }

                update() {
                    this.y += this.speedY;
                    if (this.y > canvas.height + 20) {
                        this.markedForDeletion = true;
                    }
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.fillStyle = this.type === 'weapon' ? '#a855f7' : '#10b981';
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.type === 'weapon' ? 'W' : 'H', 0, 1);
                    ctx.restore();
                }
            }

            // Shockwave Effect (Bomb)
            class Shockwave {
                constructor(x, y, maxRadius) {
                    this.x = x;
                    this.y = y;
                    this.radius = 10;
                    this.maxRadius = maxRadius;
                    this.speed = 25;
                    this.markedForDeletion = false;
                }

                update() {
                    this.radius += this.speed;
                    if (this.radius >= this.maxRadius) {
                        this.markedForDeletion = true;
                    }
                }

                draw() {
                    ctx.save();
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 12;
                    ctx.shadowColor = '#f59e0b';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Particles
            function createExplosionParticles(x, y, radius, color) {
                const count = Math.floor(radius * 1.5);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 1;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: Math.random() * 3 + 1,
                        color: color,
                        alpha: 1,
                        decay: Math.random() * 0.03 + 0.01
                    });
                }
            }

            // Waves & Spawning
            function startNextWave() {
                waveTotalEnemies = 15 + wave * 5;
                waveEnemiesSpawned = 0;
            }

            function spawnEnemies() {
                if (boss) return; // Don't spawn regular enemies during boss fight

                if (waveEnemiesSpawned < waveTotalEnemies) {
                    if (Math.random() < 0.04) {
                        const rand = Math.random();
                        let type = 'asteroid';
                        if (rand < 0.4) type = 'ape_warrior';
                        else if (rand < 0.7) type = 'scout';
                        else if (rand < 0.85) type = 'ape_giant';

                        enemies.push(new Enemy(type));
                        waveEnemiesSpawned++;
                    }
                } else if (enemies.length === 0 && !boss) {
                    // Spawn Boss at end of wave
                    boss = new Boss();
                    bossHud.classList.remove('hidden');
                }
            }

            // Check Collisions
            function checkCollisions() {
                // Player bullets vs Enemies
                bullets.forEach(b => {
                    enemies.forEach(e => {
                        const dist = Math.hypot(b.x - e.x, b.y - e.y);
                        if (dist < b.radius + e.radius) {
                            b.markedForDeletion = true;
                            e.takeDamage(20);
                        }
                    });

                    if (boss) {
                        const dist = Math.hypot(b.x - boss.x, b.y - boss.y);
                        if (dist < b.radius + boss.radius) {
                            b.markedForDeletion = true;
                            boss.takeDamage(15);
                        }
                    }
                });

                // Enemy bullets vs Player
                enemyBullets.forEach(eb => {
                    const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
                    if (dist < eb.radius + player.width / 2) {
                        eb.markedForDeletion = true;
                        damagePlayer(15);
                    }
                });

                // Enemies vs Player
                enemies.forEach(e => {
                    const dist = Math.hypot(e.x - player.x, e.y - player.y);
                    if (dist < e.radius + player.width / 2) {
                        e.takeDamage(50);
                        damagePlayer(25);
                    }
                });

                // Powerups vs Player
                powerups.forEach(p => {
                    const dist = Math.hypot(p.x - player.x, p.y - player.y);
                    if (dist < p.radius + player.width / 2) {
                        p.markedForDeletion = true;
                        sounds.playPowerup();
                        if (p.type === 'weapon') {
                            player.weaponLevel = Math.min(3, player.weaponLevel + 1);
                        } else if (p.type === 'heal') {
                            player.hp = Math.min(player.maxHp, player.hp + 30);
                        }
                    }
                });
            }

            function damagePlayer(amount) {
                if (player.isInvincible) return;
                player.hp -= amount;
                player.isInvincible = true;
                player.invincibleTimer = 40; // ~0.6 sec invincibility

                if (player.hp <= 0) {
                    player.hp = 0;
                    gameOver();
                }
            }

            function gameOver() {
                gameState = 'GAMEOVER';
                sounds.playExplosion(true);

                // Show Game Over UI
                hud.classList.add('hidden');
                overlayScreen.classList.remove('hidden');
                menuHeader.classList.add('hidden');
                gameOverDetails.classList.remove('hidden');

                document.getElementById('final-score').innerText = score;
                document.getElementById('final-wave').innerText = `WAVE ${wave}`;
                document.getElementById('final-kills').innerText = kills;
                startBtn.innerText = 'もう一度プレイ';
            }

            function resetGame() {
                score = 0;
                wave = 1;
                kills = 0;
                bullets.length = 0;
                enemyBullets.length = 0;
                enemies.length = 0;
                powerups.length = 0;
                particles.length = 0;
                shockwaves.length = 0;
                boss = null;

                player.reset();
                startNextWave();

                overlayScreen.classList.add('hidden');
                hud.classList.remove('hidden');
                bossHud.classList.add('hidden');

                gameState = 'PLAYING';
            }

            // Update UI
            function updateUI() {
                hpBar.style.width = `${(player.hp / player.maxHp) * 100}%`;
                hpText.innerText = `${Math.ceil(player.hp)} / ${player.maxHp}`;

                bombBar.style.width = `${(player.bombEnergy / player.maxBombEnergy) * 100}%`;
                bombText.innerText = player.bombEnergy >= player.maxBombEnergy ? 'READY' : 'CHARGING';

                scoreDisplay.innerText = score;
                waveDisplay.innerText = `WAVE ${wave}`;

                if (boss) {
                    bossHpBar.style.width = `${(boss.hp / boss.maxHp) * 100}%`;
                    bossHpText.innerText = `${Math.ceil((boss.hp / boss.maxHp) * 100)}%`;
                }
            }

            // Main Game Loop
            function gameLoop() {
                // Clear Canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Starfield Background
                stars.forEach(s => {
                    s.y += s.speed;
                    if (s.y > canvas.height) s.y = 0;
                    ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });

                if (gameState === 'PLAYING') {
                    // Update & Draw Player
                    player.update();
                    player.draw();

                    // Enemy Spawning
                    spawnEnemies();

                    // Updates
                    bullets.forEach(b => b.update());
                    enemyBullets.forEach(eb => eb.update());
                    enemies.forEach(e => e.update());
                    powerups.forEach(p => p.update());
                    shockwaves.forEach(sw => sw.update());
                    if (boss) boss.update();

                    // Check Collisions
                    checkCollisions();

                    // Filter Deleted Objects
                    for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].markedForDeletion) bullets.splice(i, 1);
                    for (let i = enemyBullets.length - 1; i >= 0; i--) if (enemyBullets[i].markedForDeletion) enemyBullets.splice(i, 1);
                    for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].markedForDeletion) enemies.splice(i, 1);
                    for (let i = powerups.length - 1; i >= 0; i--) if (powerups[i].markedForDeletion) powerups.splice(i, 1);
                    for (let i = shockwaves.length - 1; i >= 0; i--) if (shockwaves[i].markedForDeletion) shockwaves.splice(i, 1);

                    // Draw Objects
                    bullets.forEach(b => b.draw());
                    enemyBullets.forEach(eb => eb.draw());
                    enemies.forEach(e => e.draw());
                    powerups.forEach(p => p.draw());
                    shockwaves.forEach(sw => sw.draw());
                    if (boss) boss.draw();

                    // Update Particles
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= p.decay;
                        if (p.alpha <= 0) {
                            particles.splice(i, 1);
                        } else {
                            ctx.save();
                            ctx.globalAlpha = p.alpha;
                            ctx.fillStyle = p.color;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        }
                    }

                    // Update HUD UI
                    updateUI();
                }

                requestAnimationFrame(gameLoop);
            }

            // Event Listeners for Controls
            window.addEventListener('keydown', e => {
                keys[e.code] = true;
                if (e.code === 'KeyB' && gameState === 'PLAYING') {
                    player.triggerBomb();
                }
            });

            window.addEventListener('keyup', e => {
                keys[e.code] = false;
            });

            // Mouse / Touch Controls
            canvas.addEventListener('mousemove', e => {
                const rect = canvas.getBoundingClientRect();
                touchX = e.clientX - rect.left;
                touchY = e.clientY - rect.top;
            });

            canvas.addEventListener('touchstart', e => {
                const rect = canvas.getBoundingClientRect();
                touchX = e.touches[0].clientX - rect.left;
                touchY = e.touches[0].clientY - rect.top;
            });

            canvas.addEventListener('touchmove', e => {
                const rect = canvas.getBoundingClientRect();
                touchX = e.touches[0].clientX - rect.left;
                touchY = e.touches[0].clientY - rect.top;
            });

            canvas.addEventListener('touchend', () => {
                touchX = null;
                touchY = null;
            });

            btnBomb.addEventListener('click', () => {
                if (gameState === 'PLAYING') {
                    player.triggerBomb();
                }
            });

            startBtn.addEventListener('click', () => {
                sounds.init();
                resetGame();
            });

            // Start Loop
            gameLoop();
        };
    </script>
</body>
</html>
